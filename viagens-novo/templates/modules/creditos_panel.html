<div id="panel-creditos" class="tab-panel" style="display:none">
  <div class="card pad">
    <div class="chead"><span class="ti2">Novo crédito</span></div>
    <form id="formCredito" class="formgrid">
      <label>Companhia *<input type="text" name="companhia" required></label>
      <label>Localizador<input type="text" name="localizador"></label>
      <label>Valor (R$) *<input type="text" name="valor" required></label>
      <label>Validade<input type="date" name="validade"></label>
      <label>Status
        <select name="status"><option>Aguardando utilizacao</option><option>Ja utilizado</option></select>
      </label>
      <div class="formactions full"><button type="submit" class="primary">Adicionar</button></div>
    </form>
  </div>
  <div class="card" style="margin-top:16px;overflow-x:auto">
    <table class="dtable" id="tabelaCreditos"><thead><tr>
      <th>Companhia</th><th>Localizador</th><th>Valor</th><th>Validade</th><th>Status</th>
    </tr></thead><tbody></tbody></table>
  </div>
</div>

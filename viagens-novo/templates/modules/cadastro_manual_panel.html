<div id="panel-cadastro" class="tab-panel" style="display:none">
  <div class="hint" style="margin-bottom:14px">Cada bloco é independente - salva só o que precisar. Dá pra lançar uma hospedagem ou um veículo avulso, sem passagem nenhuma junto, ou os três juntos se for o caso.</div>

  <div class="card pad">
    <div class="chead"><span class="ti2">Passagem</span></div>
    <form id="formCadastroPassagem" class="formgrid">
      <label>Colaborador *<input type="text" name="nome_colab" required></label>
      <label>Obra *<input type="text" name="nome_obra" required></label>
      <label>Função<input type="text" name="nome_funcao"></label>
      <label>Modalidade *
        <select name="modalidade" required><option value="Aereo">Aéreo</option><option value="Rodoviario">Rodoviário</option></select>
      </label>
      <label>Tipo de viagem
        <select name="tipo_viagem"><option value="Ida">Somente ida</option><option value="Ida e volta">Ida e volta</option></select>
      </label>
      <label>Companhia<input type="text" name="companhia"></label>
      <label>Origem<input type="text" name="origem"></label>
      <label>Destino<input type="text" name="destino"></label>
      <label>Localizador<input type="text" name="localizador"></label>
      <label>Pedido<input type="text" name="pedido"></label>
      <label>Data de ida<input type="date" name="data_ida"></label>
      <label>Data de volta<input type="date" name="data_ida_volta"></label>
      <label>Data de compra<input type="date" name="data_compra"></label>
      <label>Valor aprovado (R$)<input type="text" name="valorAprovado" placeholder="0,00"></label>
      <label>Valor pago (R$)<input type="text" name="valor_pago" placeholder="0,00"></label>
      <label class="full">Observação<textarea name="observacao"></textarea></label>
      <div class="formactions full">
        <button type="submit" class="primary">Salvar passagem</button>
      </div>
    </form>
  </div>

  <div class="card pad" style="margin-top:16px">
    <div class="chead"><span class="ti2">Hospedagem</span></div>
    <form id="formCadastroHospedagem" class="formgrid">
      <label>Colaborador *<input type="text" name="nome" required></label>
      <label>Obra *<input type="text" name="obra" required></label>
      <label>Número do pedido<input type="text" name="pedido"></label>
      <label>Valor (R$)<input type="text" name="valor" placeholder="0,00"></label>
      <label>Tipo Acomodação?
        <select name="hosp_tipo_acomodacao">
          <option value="">Selecione uma opção</option>
          <option>Hotel</option><option>Pousada</option><option>Apart-hotel</option>
        </select>
      </label>
      <label>Cidade Acomodação?<input type="text" name="hosp_cidade_acomodacao"></label>
      <label>Data Entrada?<input type="date" name="hosp_data_entrada"></label>
      <label>Horário Entrada?<input type="time" name="hosp_horario_entrada"></label>
      <label>Data Saída?<input type="date" name="hosp_data_saida"></label>
      <label>Horário Saída?<input type="time" name="hosp_horario_saida"></label>
      <label class="full">Alguma particularidade?<input type="text" name="hosp_particularidade"></label>
      <div class="formactions full">
        <button type="submit" class="primary">Salvar hospedagem</button>
      </div>
    </form>
  </div>

  <div class="card pad" style="margin-top:16px">
    <div class="chead"><span class="ti2">Veículo</span></div>
    <form id="formCadastroVeiculo" class="formgrid">
      <label>Colaborador *<input type="text" name="nome" required></label>
      <label>Obra *<input type="text" name="obra" required></label>
      <label>Número do pedido<input type="text" name="pedido"></label>
      <label>Valor (R$)<input type="text" name="valor" placeholder="0,00"></label>
      <label>Data Retirada?<input type="date" name="veic_data_retirada"></label>
      <label>Local Retirada?<input type="text" name="veic_local_retirada"></label>
      <label>Horário Retirada?<input type="time" name="veic_horario_retirada"></label>
      <label>Data/Previsão Devolução?<input type="date" name="veic_data_devolucao"></label>
      <label>Horário Devolução?<input type="time" name="veic_horario_devolucao"></label>
      <label class="full">Observações do veículo<textarea name="veic_observacoes"></textarea></label>
      <div class="formactions full">
        <button type="submit" class="primary">Salvar veículo</button>
      </div>
    </form>
  </div>
</div>

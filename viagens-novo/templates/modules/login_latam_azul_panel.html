<div id="panel-config-cotacao" class="tab-panel" style="display:none">
  <div class="hint" style="margin-bottom:14px">Login usado pelo robô de cotação (LATAM/Azul) quando alguém marca "Cotar minha passagem". Fica salvo só na sua máquina (na pasta do robô de cotação), nunca sai daqui.</div>
  <div id="configCotacaoAviso"></div>
  <div class="two">
    <div class="card pad">
      <div class="chead"><span class="ti2">LATAM</span><span class="lbl" id="statusLatam">-</span></div>
      <form class="formgrid" data-cia="LATAM">
        <label>Usuário / e-mail<input type="text" name="usuario" autocomplete="off"></label>
        <label>Senha<input type="password" name="senha" autocomplete="new-password" placeholder="deixe em branco para manter a atual"></label>
        <label class="full">Site (opcional)<input type="text" name="siteUrl" placeholder="deixe em branco para usar o padrão"></label>
        <div class="formactions full"><button type="submit" class="primary">Salvar login LATAM</button></div>
      </form>
    </div>
    <div class="card pad">
      <div class="chead"><span class="ti2">Azul</span><span class="lbl" id="statusAzul">-</span></div>
      <form class="formgrid" data-cia="AZUL">
        <label>Usuário / e-mail<input type="text" name="usuario" autocomplete="off"></label>
        <label>Senha<input type="password" name="senha" autocomplete="new-password" placeholder="deixe em branco para manter a atual"></label>
        <label class="full">Site (opcional)<input type="text" name="siteUrl" placeholder="deixe em branco para usar o padrão"></label>
        <div class="formactions full"><button type="submit" class="primary">Salvar login Azul</button></div>
      </form>
    </div>
  </div>
</div>

<!-- Modal: detalhe da solicitacao / cotacao / compra -->
<div class="modal" id="modalSolicitacao">
  <div class="modal-box wide">
    <div class="chead"><span class="ti2">Solicitação</span><span class="lbl" id="modalSolStatus"></span></div>
    <div id="modalSolBody"></div>
    <div class="formactions"><button class="ghost" id="btnFecharModalSol">Fechar</button></div>
  </div>
</div>

<!-- Modal: comprar passagem -->
<div class="modal" id="modalComprar">
  <div class="modal-box wide">
    <div class="chead"><span class="ti2">Comprar passagem</span></div>
    <form id="formComprar">
      <div class="sec" style="margin:18px 0 8px">Passagem de ida</div>
      <div class="formgrid">
        <label>Meio de transporte<input type="text" name="ida_meioTransporte"></label>
        <label>Companhia<input type="text" name="ida_companhia"></label>
        <label>Origem<input type="text" name="ida_origem"></label>
        <label>Destino<input type="text" name="ida_destino"></label>
        <label>Data viagem<input type="date" name="ida_dataViagem"></label>
        <label>Data chegada<input type="date" name="ida_dataChegada"></label>
        <label>Localizador<input type="text" name="ida_localizador"></label>
        <label>Data compra<input type="date" name="ida_dataCompra"></label>
      </div>
      <div class="sec">Passagem de volta <span class="ct">se houver</span></div>
      <div class="formgrid">
        <label>Meio de transporte<input type="text" name="volta_meioTransporte"></label>
        <label>Companhia<input type="text" name="volta_companhia"></label>
        <label>Origem<input type="text" name="volta_origem"></label>
        <label>Destino<input type="text" name="volta_destino"></label>
        <label>Data viagem<input type="date" name="volta_dataViagem"></label>
        <label>Data chegada<input type="date" name="volta_dataChegada"></label>
        <label>Localizador<input type="text" name="volta_localizador"></label>
        <label>Data compra<input type="date" name="volta_dataCompra"></label>
      </div>
      <div class="sec">Valores</div>
      <div class="formgrid">
        <label>Valor aprovado (R$)<input type="text" name="valorAprovado"></label>
        <label>Valor pago (R$)<input type="text" name="valorPago"></label>
        <label class="full" style="flex-direction:row;align-items:center;gap:8px">
          <input type="checkbox" name="reembolso" style="width:auto"> Reembolso
        </label>
        <label class="full">Observação interna<textarea name="observacaoInterna"></textarea></label>
      </div>
      <div class="formactions">
        <button type="button" class="ghost" id="btnFecharModalComprar">Cancelar</button>
        <button type="submit" class="primary green">Salvar compra</button>
      </div>
    </form>
  </div>
</div>
